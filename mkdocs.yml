site_name: Gnosis Online
site_description: Gnosis Online lore and game documentation
site_url: https://lyon1255.github.io/gnosis-online-docs/

theme:
  name: material
  language: hu

  palette:
    scheme: slate
    primary: black
    accent: deep purple

  features:
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Kezdőlap: index.md

  - Lore:
      - Prologue: lore/00-prologus-lore.md
      - Brink Valley: lore/01-brink-valley-lore.md

      - Elysia:
          - Main Lore: lore/02-elysia-lore.md
          - Side Quests: lore/side-quests/elysia.md

  - Gameplay:
      - Áttekintés: gameplay/index.md

      - Elysia:
          - Level Design: gameplay/level-design.md
          - Main Quests: gameplay/main-quests/elysia.md
          - Side Quests: gameplay/side-quests/elysia.md
          - NPCs: gameplay/npcs/elysia.md
          - Items: gameplay/items/elysia.md
          - Enemies: gameplay/enemies/elysia.md
          - Bosses: gameplay/bosses/elysia.md

  - Embermask Forge:
      - Interface:
          - Overview: Embermask-Forge/Interface/overview.md
          - Achievement Events: Embermask-Forge/Interface/AchievementEvents.md
          - Appearance Events: Embermask-Forge/Interface/AppearanceEvents.md
          - Auction Events: Embermask-Forge/Interface/AuctionEvents.md
          - Aura Events: Embermask-Forge/Interface/AuraEvents.md
          - Character Events: Embermask-Forge/Interface/CharacterEvents.md
          - Chat Events: Embermask-Forge/Interface/ChatEvents.md
          - Combat Events: Embermask-Forge/Interface/CombatEvents.md
          - Contract Events: Embermask-Forge/Interface/ContractEvents.md
          - Currency Events: Embermask-Forge/Interface/CurrencyEvents.md
          - Death Events: Embermask-Forge/Interface/DeathEvents.md
          - Encounter Events: Embermask-Forge/Interface/EncounterEvents.md
          - Equipment Events: Embermask-Forge/Interface/EquipmentEvents.md
          - Group Events: Embermask-Forge/Interface/GroupEvents.md
          - Guild Events: Embermask-Forge/Interface/GuildEvents.md
          - Interaction Events: Embermask-Forge/Interface/InteractionEvents.md
          - Inventory Events: Embermask-Forge/Interface/InventoryEvents.md
          - Item Events: Embermask-Forge/Interface/ItemEvents.md
          - Loot Events: Embermask-Forge/Interface/LootEvents.md
          - Mail Events: Embermask-Forge/Interface/MailEvents.md
          - Map Events: Embermask-Forge/Interface/MapEvents.md
          - Mount Events: Embermask-Forge/Interface/MountEvents.md
          - Movement Events: Embermask-Forge/Interface/MovementEvents.md
          - Platform Events: Embermask-Forge/Interface/PlatformEvents.md
          - PvP Events: Embermask-Forge/Interface/PvPEvents.md
          - Quest Events: Embermask-Forge/Interface/QuestEvents.md
          - Reputation Events: Embermask-Forge/Interface/ReputationEvents.md
          - Settings Events: Embermask-Forge/Interface/SettingsEvents.md
          - Social Events: Embermask-Forge/Interface/SocialEvents.md
          - Spell Events: Embermask-Forge/Interface/SpellEvents.md
          - Stats Events: Embermask-Forge/Interface/StatsEvents.md
          - System Events: Embermask-Forge/Interface/SystemEvents.md
          - Trade Events: Embermask-Forge/Interface/TradeEvents.md
          - Unit Events: Embermask-Forge/Interface/UnitEvents.md
          - Vendor Events: Embermask-Forge/Interface/VendorEvents.md
          - World Events: Embermask-Forge/Interface/WorldEvents.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables

  - toc:
      title: Tartalomjegyzék
      permalink: true
      permalink_title: Közvetlen hivatkozás erre a fejezetre
      toc_depth: 3

  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

copyright: "© 2026 Gnosis Online"

extra:
  generator: false
